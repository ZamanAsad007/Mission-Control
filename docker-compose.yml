services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: mission_control_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mission_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mission_password}
      POSTGRES_DB: ${POSTGRES_DB:-mission_control}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mission_user} -d ${POSTGRES_DB:-mission_control}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mission_control_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ingestion-service:
    build:
      context: .
      dockerfile: services/ingestion-service/Dockerfile
    container_name: mission_control_ingestion
    restart: unless-stopped
    ports:
      - "${INGESTION_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      INGESTION_PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-mission_user}:${POSTGRES_PASSWORD:-mission_password}@postgres:5432/${POSTGRES_DB:-mission_control}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NASA_API_KEY: ${NASA_API_KEY:-DEMO_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-service:
    build:
      context: .
      dockerfile: services/api-service/Dockerfile
    container_name: mission_control_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-mission_user}:${POSTGRES_PASSWORD:-mission_password}@postgres:5432/${POSTGRES_DB:-mission_control}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: mission_control_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"

  gateway:
    image: nginx:1.27-alpine
    container_name: mission_control_gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-service
      - frontend

  alert-service:
    build:
      context: .
      dockerfile: services/alert-service/Dockerfile
    container_name: mission_control_alerts
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-mission_user}:${POSTGRES_PASSWORD:-mission_password}@postgres:5432/${POSTGRES_DB:-mission_control}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: alerts@mission-control.space
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:latest
    container_name: mission_control_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  pgdata:
  redisdata:

